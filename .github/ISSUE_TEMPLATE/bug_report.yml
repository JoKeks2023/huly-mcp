name: Bug report
description: Something does not work as described
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The fastest way to a fix: ask your AI client to run **`check_setup`** (or run `huly-mcp check-setup` in a terminal) and paste the result below. It shows version, login type, workspaces and settings — never passwords or tokens.
        **Security problem?** Please don't open an issue — see [SECURITY.md](https://github.com/JoKeks2023/huly-mcp/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead? Tool name and the error text help most.
      placeholder: |
        Asked Claude to move PROJ-12 to Done; update_issue answered "Status 'Done' not found".
    validations:
      required: true
  - type: textarea
    id: check_setup
    attributes:
      label: Output of check_setup
      description: Remove anything you consider private (host names, workspace names).
      render: markdown
  - type: dropdown
    id: huly
    attributes:
      label: Huly
      options:
        - Self-hosted (huly-selfhost)
        - Huly Cloud (huly.app)
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run the server?
      options:
        - npx / npm (stdio)
        - Claude Code plugin
        - Claude Desktop extension (.mcpb)
        - Docker
        - HTTP team server (huly-mcp http / OAuth)
        - Command line (huly-mcp <tool>)
        - Other
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: AI client
      placeholder: Claude Code 2.x, Claude Desktop, Cursor, VS Code, …
  - type: input
    id: version
    attributes:
      label: huly-mcp-selfhost version
      description: Shown by check_setup, or `npx huly-mcp-selfhost --version`.
      placeholder: "3.6.0"
