version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Types follow the oldest supported Node major (package.json engines), not the newest.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Huly is frozen (Nov 2026); 0.7.423 is its last npm release and ships without type
      # definitions (160 x TS7016, HULY-44). Newer versions, if any appear, are still proposed.
      - dependency-name: '@hcengineering/*'
        versions: ['0.7.423']
    groups:
      # Huly's packages move together; one PR per release keeps them consistent.
      huly:
        patterns: ['@hcengineering/*']
      dev:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
