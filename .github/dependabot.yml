version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Types follow the oldest supported Node major (package.json engines), not the newest.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # Huly's packages move together; one PR per release keeps them consistent.
      huly:
        patterns: ['@hcengineering/*']
      dev:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
