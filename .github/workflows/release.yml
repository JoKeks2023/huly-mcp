name: Release

# Push a tag vX.Y.Z on main → checks, npm (with provenance), GitHub release from the README changelog,
# MCP registry entry. Docker images are built by docker-publish.yml on the same tag.
#
# npm: uses Trusted Publishing (OIDC, no token in the repo). One-time setup on npmjs.com:
#   package huly-mcp-selfhost → Settings → Trusted publishing → GitHub Actions,
#   repository JoKeks2023/huly-mcp, workflow release.yml.
# Until that is set up, an NPM_TOKEN secret works as a fallback.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re-)publish, e.g. v3.1.0
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Tag matches package version and is on main
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$TAG" ] || { echo "::error::Tag $TAG does not match package.json version $version"; exit 1; }
          git merge-base --is-ancestor "$TAG" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          node .github/scripts/changelog-section.mjs "$version" > notes.md

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node .github/scripts/stdio-smoke.mjs node dist/index.js
      - run: node .github/scripts/package-check.mjs
      - name: Personal data check
        run: .github/scripts/personal-data.sh
        env:
          PERSONAL_DATA_PATTERNS: ${{ secrets.PERSONAL_DATA_PATTERNS }}

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@latest >/dev/null 2>&1   # Trusted Publishing needs npm >= 11.5
          if npm view "huly-mcp-selfhost@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::huly-mcp-selfhost@$VERSION is already on npm — skipped"
          else
            npm publish --provenance --access public
          fi

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Title: the annotated tag message if it says more than the version, else just the version.
          subject=$(git tag -l --format='%(contents:subject)' "$TAG")
          title="v$VERSION"
          [ -n "$subject" ] && [ "$subject" != "$TAG" ] && [ "$subject" != "v$VERSION" ] && title="$subject"
          if gh release view "$TAG" >/dev/null 2>&1; then gh release edit "$TAG" --notes-file notes.md
          else gh release create "$TAG" --title "$title" --notes-file notes.md --verify-tag --latest; fi

      - name: Publish to the MCP registry
        continue-on-error: true   # the registry is optional; a hiccup there must not fail the release
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
