name: Release

# Push a tag vX.Y.Z on main → checks, npm (with provenance), GitHub release from CHANGELOG.md,
# MCP registry entry. Docker images are built by docker-publish.yml on the same tag.
#
# npm: uses Trusted Publishing (OIDC, no token in the repo). One-time setup on npmjs.com:
#   package huly-mcp-selfhost → Settings → Trusted publishing → GitHub Actions,
#   repository JoKeks2023/huly-mcp, workflow release.yml, environment release.
# Until that is set up, an NPM_TOKEN secret works as a fallback.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re-)publish, e.g. v3.1.0
        required: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Environment "release" (Settings → Environments): restrict to tags v*, optionally require approval.
    # npm Trusted Publishing must name the same environment.
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # No registry-url: setup-node would write an .npmrc with an (empty) auth token,
          # which can keep npm from using Trusted Publishing (OIDC).

      - name: Tag matches package version and is on main
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$TAG" ] || { echo "::error::Tag $TAG does not match package.json version $version"; exit 1; }
          git merge-base --is-ancestor "$TAG" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          node .github/scripts/changelog-section.mjs "$version" > notes.md

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node .github/scripts/stdio-smoke.mjs node dist/index.js
      - run: node .github/scripts/package-check.mjs
      - name: Personal data check
        run: .github/scripts/personal-data.sh
        env:
          PERSONAL_DATA_PATTERNS: ${{ secrets.PERSONAL_DATA_PATTERNS }}

      - name: Publish to npm
        id: npm
        # A failure here must not block the GitHub release; the job still fails at the end.
        continue-on-error: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@latest   # Trusted Publishing needs npm >= 11.5.1
          echo "npm $(npm --version), OIDC request URL present: $([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && echo yes || echo no)"
          if npm view "huly-mcp-selfhost@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::huly-mcp-selfhost@$VERSION is already on npm — skipped"
          else
            # Trusted Publishing (OIDC) first; a classic token only if the NPM_TOKEN secret exists.
            if [ -n "$NPM_TOKEN" ]; then npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"; fi
            npm publish --provenance --access public --loglevel verbose || {
              echo "::group::npm debug log (OIDC / auth lines)"
              grep -ihE "oidc|trusted|id-token|provenance|auth|token|403|404|E4[0-9][0-9]" ~/.npm/_logs/*-debug-0.log | grep -viE "authorization: |bearer " | tail -60 || true
              echo "::endgroup::"
              exit 1
            }
          fi

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Title: the annotated tag message if it says more than the version, else just the version.
          subject=$(git tag -l --format='%(contents:subject)' "$TAG")
          title="v$VERSION"
          [ -n "$subject" ] && [ "$subject" != "$TAG" ] && [ "$subject" != "v$VERSION" ] && title="$subject"
          if gh release view "$TAG" >/dev/null 2>&1; then gh release edit "$TAG" --notes-file notes.md
          else gh release create "$TAG" --title "$title" --notes-file notes.md --verify-tag --latest; fi

      - name: Claude Desktop extension (.mcpb) on the GitHub release
        id: mcpb
        # Optional: a problem here must not fail the release.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/mcpb.js build
          mkdir -p build/check && unzip -q "build/huly-mcp-selfhost.mcpb" -d build/check
          node .github/scripts/stdio-smoke.mjs node build/check/server/index.js
          gh release upload "$TAG" "build/huly-mcp-selfhost.mcpb" --clobber

      - name: Publish to the MCP registry
        id: registry
        # The registry verifies the npm package, so only after npm worked.
        if: steps.npm.outcome == 'success'
        continue-on-error: true   # the registry is optional; a hiccup there must not fail the release
        run: |
          # The registry checks the npm package; a fresh release can take several minutes to appear
          # there (3.5.1 took more than 5). Wait up to 15 minutes, then try the publish a few times,
          # because the registry may still see the old npm data right after it became visible here.
          for i in $(seq 1 90); do
            curl -sf "https://registry.npmjs.org/huly-mcp-selfhost/$VERSION" >/dev/null && break
            echo "waiting for npm to show $VERSION ($i/90)"; sleep 10
          done
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3; do
            ./mcp-publisher publish && exit 0
            echo "registry publish attempt $attempt failed"; [ "$attempt" -lt 3 ] && sleep 60
          done
          exit 1

      - name: Warn if the Desktop extension is missing
        if: steps.mcpb.outcome == 'failure'
        run: echo "::warning::The .mcpb was not attached to $TAG (see 'Claude Desktop extension'). npm and the GitHub release are fine."

      - name: Warn if the MCP registry refused the entry
        if: steps.registry.outcome == 'failure'
        run: echo "::warning::The MCP registry did not take $TAG (see 'Publish to the MCP registry'). npm and the GitHub release are fine. Retry later via gh workflow run release.yml --ref $TAG -f tag=$TAG (npm is skipped when the version is already there)."

      - name: Fail the run if npm publishing failed
        if: steps.npm.outcome == 'failure'
        run: |
          echo "::error::npm publishing failed. The GitHub release was created anyway. Fix npm (see the 'Publish to npm' step) and re-run this workflow for $TAG, or run npm publish by hand."
          exit 1
