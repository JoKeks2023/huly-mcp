name: Links

on:
  pull_request:
    paths: ['**.md', 'site/**']
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 5xx = the other site is having a moment; only dead links (4xx) fail a PR.
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 --accept '200..=299,429,500..=599' --exclude '^https://www\.npmjs\.com/' --exclude-path docs/tasks './**/*.md' 'site/**/*.html'
          fail: ${{ github.event_name == 'pull_request' }}
      - name: Open an issue for broken links (weekly run)
        if: github.event_name != 'pull_request' && steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Broken links ($(date -u +%F))"
          gh issue list --state open --search "Broken links in:title" --json number --jq '.[].number' | grep -q . \
            || gh issue create --title "$title" --body-file ./lychee/out.md --label documentation || gh issue create --title "$title" --body-file ./lychee/out.md
