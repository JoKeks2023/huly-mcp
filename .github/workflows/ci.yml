name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        include:
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Server answers over stdio
        run: node .github/scripts/stdio-smoke.mjs node dist/index.js

  workflows:
    name: lint workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  package:
    name: npm package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node .github/scripts/package-check.mjs

  privacy:
    name: personal data and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (secrets in the whole history)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Personal data in tracked files
        run: .github/scripts/personal-data.sh
        env:
          PERSONAL_DATA_PATTERNS: ${{ secrets.PERSONAL_DATA_PATTERNS }}

  docker:
    name: docker image (build, smoke, scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: huly-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Server in the image answers over stdio
        run: node .github/scripts/stdio-smoke.mjs docker run -i --rm --entrypoint node huly-mcp:ci dist/index.js
      - name: HTTP entrypoint (mcp-proxy) answers, and checks the Host header
        run: |
          docker run -d --name proxy -p 8000:8000 -e HULY_EMAIL=ci@example.com -e HULY_PASSWORD=x \
            -e MCP_ALLOWED_HOSTS=mcp.example.com,mcp.example.com:8443 huly-mcp:ci
          # SSE never ends: curl times out (exit 28) after printing the headers, hence || true (bash runs with pipefail).
          status () { { curl -s -m 3 -o /dev/null -D - -H "Host: $1" http://localhost:8000/sse || true; } | head -1 | awk '{print $2}'; }
          for _ in $(seq 1 30); do [ -n "$(status localhost:8000)" ] && break; sleep 1; done
          fail=0
          for case in "localhost:8000 200" "mcp.example.com 200" "mcp.example.com:8443 200" "evil.example.com 421"; do
            host=${case% *}; want=${case#* }
            got=$(status "$host")
            echo "Host: $host → $got (expected $want)"
            [ "$got" = "$want" ] || fail=1
          done
          docker logs proxy 2>&1 | grep -q 'MCP_ALLOWED_HOSTS' && echo 'unexpected warning' && fail=1
          docker rm -f proxy
          # Without MCP_ALLOWED_HOSTS the container warns in its log.
          docker run -d --name proxy2 -e HULY_EMAIL=ci@example.com -e HULY_PASSWORD=x huly-mcp:ci
          sleep 3; docker logs proxy2 2>&1 | grep -q 'MCP_ALLOWED_HOSTS is not set' || { echo 'missing warning'; fail=1; }
          docker rm -f proxy2
          exit $fail
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: huly-mcp:ci
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Upload scan to code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: huly-mcp:ci
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '1'

  token-report:
    name: token report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: base
      - name: Measure tools/list (base and head)
        run: |
          (cd base && npx tsx ../.github/scripts/tool-sizes.ts .) > base.json
          npx tsx .github/scripts/tool-sizes.ts . > head.json
          node .github/scripts/token-report.mjs base.json head.json > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the pull request
        # Forks get a read-only token; the report is still in the job summary.
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- huly-mcp-token-report -->")) | .id' | head -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@report.md >/dev/null
          else gh pr comment "$PR" --body-file report.md; fi
